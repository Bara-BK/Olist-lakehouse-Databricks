resources:
  jobs:
    olist_lakehouse_pipeline:
      name: olist_lakehouse_pipeline
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: /Workspace/Users/barabenkhedher@gmail.com/01_bronze_ingestion
            source: WORKSPACE
        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: /Workspace/Users/barabenkhedher@gmail.com/02_silver_transformation
            source: WORKSPACE
        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: /Workspace/Users/barabenkhedher@gmail.com/03_gold_star_schema
            source: WORKSPACE
        - task_key: quality_gate
          depends_on:
            - task_key: gold
          notebook_task:
            notebook_path: /Workspace/Users/barabenkhedher@gmail.com/04_pipeline_summary
            source: WORKSPACE
      queue:
        enabled: true
      parameters:
        - name: batch
          default: all
        - name: run_id
          default: "{{job.run_id}}"
      performance_target: PERFORMANCE_OPTIMIZED
